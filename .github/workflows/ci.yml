name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly rolling-Node run even when nothing is pushed.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  TURBO_CACHE_DIR: .turbo/cache
  DO_NOT_TRACK: "1"

jobs:
  # Cheap gate: fail before any build starts when pnpm-lock.yaml drifted from
  # the workspace package.json files.
  verify-lockfile:
    name: Verify lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify pnpm-lock.yaml is in sync
        run: pnpm install --frozen-lockfile --lockfile-only

  build-test:
    name: Build, Typecheck & Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    needs: [verify-lockfile]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Node 22 on every supported OS, plus Node 24 where it is cheapest.
          - os: ubuntu-latest
            node-version: 24
          - os: macos-latest
            node-version: 22
          - os: windows-latest
            node-version: 22
          - os: ubuntu-latest
            node-version: 22
    steps:
      - uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node${{ matrix.node-version }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-node${{ matrix.node-version }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-node${{ matrix.node-version }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # Packaging is platform-independent apart from POSIX exec bits, so it runs
  # once on Linux instead of in every matrix leg. This is also the only job
  # that boots the built bins the way npx does.
  packaging:
    name: Packaging & release guards
    runs-on: ubuntu-latest
    needs: [verify-lockfile]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node22-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-node22-${{ github.ref_name }}-
            turbo-${{ runner.os }}-node22-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build
        run: pnpm build

      - name: Verify package tarballs
        # Every published package must ship dist/ and a shebang on each bin
        # (issue #18: npx cannot exec a JS bin without one on macOS/Linux).
        # Also enforces the release scopes and the shared entry-point guard.
        run: pnpm verify:pack

      - name: Verify bins launch through a .bin symlink
        # POSIX package managers symlink `bin` entries; a server that compares
        # process.argv[1] to import.meta.url without resolving symlinks exits
        # silently on startup.
        run: pnpm verify:launch

      - name: Lint
        run: pnpm lint:ox

      - name: Token budget lint
        run: pnpm lint:tokens

      - name: Verify plugin manifests and mcp.json pins
        run: pnpm check:plugin

  # Latest stable Node, only on main/schedule: the PR matrix above already
  # covers Node 22 and 24, so paying for a third full run per PR is waste.
  ci-rolling:
    name: CI (rolling Node)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [verify-lockfile]
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - name: Setup latest Node.js
        uses: actions/setup-node@v7
        with:
          node-version: current
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node-current-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-node-current-${{ github.ref_name }}-
            turbo-${{ runner.os }}-node-current-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
